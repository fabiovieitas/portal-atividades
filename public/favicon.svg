<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="128" height="128" rx="36" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="32" fill="none" stroke="url(#cyan)" stroke-width="4"/>

  <!-- Antenna -->
  <circle cx="64" cy="20" r="7" fill="url(#gold)"/>
  <rect x="61" y="24" width="6" height="14" rx="3" fill="#94a3b8"/>

  <!-- Robot Head -->
  <rect x="28" y="38" width="72" height="58" rx="18" fill="url(#cyan)"/>
  <rect x="34" y="44" width="60" height="46" rx="12" fill="#0f172a"/>

  <!-- Ears -->
  <rect x="18" y="56" width="10" height="22" rx="5" fill="url(#gold)"/>
  <rect x="100" y="56" width="10" height="22" rx="5" fill="url(#gold)"/>

  <!-- Robot Eyes (Glow) -->
  <circle cx="49" cy="62" r="10" fill="#38bdf8"/>
  <circle cx="49" cy="62" r="6" fill="#ffffff"/>
  <circle cx="79" cy="62" r="10" fill="#38bdf8"/>
  <circle cx="79" cy="62" r="6" fill="#ffffff"/>

  <!-- Cute Smile -->
  <path d="M 50 78 Q 64 88 78 78" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Cheeks -->
  <circle cx="39" cy="74" r="3.5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="89" cy="74" r="3.5" fill="#f43f5e" opacity="0.8"/>
</svg>

