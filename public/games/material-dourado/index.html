<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Dourado Virtual 3D: Desafio do Sistema Decimal | Lab Kids</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Fredoka', sans-serif;
            background: #090d16;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 15px;
        }

        #canvas-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .game-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.94);
            border: 3px solid #f59e0b;
            border-radius: 28px;
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.3), inset 0 0 20px rgba(245, 158, 11, 0.1);
            backdrop-filter: blur(12px);
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #334155;
            padding: 12px 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .mode-switch {
            display: flex;
            gap: 8px;
            background: #0f172a;
            padding: 4px;
            border-radius: 50px;
            border: 1px solid #334155;
        }
        .btn-tab {
            padding: 8px 18px;
            border-radius: 50px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-tab.active {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .target-box {
            width: 100%;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border: 2px solid #fbbf24;
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.2);
        }
        .target-title { font-size: 1.1rem; color: #cbd5e1; font-weight: 600; margin-bottom: 5px; }
        .target-num { font-size: 3.2rem; font-weight: 800; color: #fbbf24; text-shadow: 0 0 15px rgba(251, 191, 36, 0.5); }

        /* PLAYGROUND DISPLAY AREA */
        .workspace {
            width: 100%;
            min-height: 220px;
            background: #090d16;
            border: 2px dashed #475569;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
            justify-content: center;
            position: relative;
        }
        .block-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }

        /* 3D MATERIAL DOURADO STYLES */
        .placa-100 {
            width: 110px; height: 110px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border: 2px solid #f87171;
            border-radius: 8px;
            box-shadow: 0 6px 15px rgba(239, 68, 68, 0.4), inset 0 0 0 2px rgba(255,255,255,0.2);
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 1px;
            padding: 2px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .placa-100:hover { transform: scale(1.05); }
        .cell-100 { background: rgba(0,0,0,0.15); border-radius: 1px; }

        .barra-10 {
            width: 24px; height: 110px;
            background: linear-gradient(135deg, #f59e0b, #b45309);
            border: 2px solid #fbbf24;
            border-radius: 6px;
            box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4), inset 0 0 0 2px rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .barra-10:hover { transform: scale(1.05); }
        .cell-10 { height: 8px; background: rgba(0,0,0,0.2); border-radius: 1px; }

        .cubo-1 {
            width: 22px; height: 22px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: 2px solid #60a5fa;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4), inset 0 0 0 1px rgba(255,255,255,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .cubo-1:hover { transform: scale(1.15); }

        /* CONTROLS BAR */
        .controls-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .btn-add {
            padding: 14px 22px;
            border-radius: 50px;
            border: none;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
        }
        .btn-add:hover { transform: translateY(-2px) scale(1.03); }
        .btn-add:active { transform: translateY(0); }

        .btn-placa { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-barra { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-cubo { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .btn-magic { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; }
        .btn-reset { background: linear-gradient(135deg, #475569, #334155); color: white; }

        /* STATS COUNTER BAR */
        .summary-bar {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
            flex-wrap: wrap;
            gap: 10px;
        }

        .val-centena { color: #f87171; }
        .val-dezena { color: #fbbf24; }
        .val-unidade { color: #60a5fa; }
        .val-total { color: #34d399; font-size: 1.4rem; }

        /* MODAL OVERLAY */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            z-index: 50;
        }
        .modal-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 12px; }
        .modal-sub { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 25px; max-width: 550px; line-height: 1.5; }

        .btn-action {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            transition: all 0.2s ease;
        }
        .btn-action:hover { transform: scale(1.05); }

        .back-link {
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .back-link:hover { color: #fbbf24; }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>

    <div class="game-wrapper">
        <!-- HEADER MODE SWITCH -->
        <div class="header-bar">
            <div style="font-weight: 800; font-size: 1.1rem; color: #fbbf24;">🟡 MATERIAL DOURADO VIRTUAL</div>
            <div class="mode-switch">
                <button class="btn-tab active" id="tab-challenge" onclick="setMode('challenge')">🎮 MODO DESAFIO</button>
                <button class="btn-tab" id="tab-sandbox" onclick="setMode('sandbox')">🛠️ LABORATÓRIO LIVRE</button>
            </div>
        </div>

        <!-- TARGET BOX (DESAFIO) -->
        <div class="target-box" id="target-box">
            <div class="target-title" id="target-label">Construa o número abaixo usando o Material Dourado:</div>
            <div class="target-num" id="target-val">145</div>
        </div>

        <!-- WORKSPACE AREA -->
        <div class="workspace" id="workspace">
            <!-- Dynamic Material Dourado Blocks -->
        </div>

        <!-- CONTROLS ROW -->
        <div class="controls-row">
            <button class="btn-add btn-placa" onclick="addBlock(100)">🟥 +1 Placa (100)</button>
            <button class="btn-add btn-barra" onclick="addBlock(10)">🟨 +1 Barra (10)</button>
            <button class="btn-add btn-cubo" onclick="addBlock(1)">🟦 +1 Cubinho (1)</button>
            <button class="btn-add btn-magic" onclick="autoGroup()">✨ Agrupar 10x ➔ Dezena/Placa</button>
            <button class="btn-add btn-reset" onclick="resetAll()">🔄 Limpar</button>
        </div>

        <!-- SUMMARY COUNTER BAR -->
        <div class="summary-bar">
            <div>Centenas (100): <span class="val-centena" id="cnt-c">0</span></div>
            <div>Dezenas (10): <span class="val-dezena" id="cnt-d">0</span></div>
            <div>Unidades (1): <span class="val-unidade" id="cnt-u">0</span></div>
            <div>TOTAL: <span class="val-total" id="cnt-total">0</span></div>
        </div>

        <a href="/" class="back-link">⬅️ Voltar ao Portal Lab Kids</a>

        <!-- MODAL OVERLAY -->
        <div class="modal-overlay" id="game-modal" style="display: none;">
            <div class="modal-title" id="modal-title" style="color: #fbbf24;">🎉 NÚMERO CONSTRUÍDO COM SUCESSO!</div>
            <div class="modal-sub" id="modal-sub">
                Parabéns! Você representou o número perfeitamente usando o Sistema Decimal!
            </div>
            <button class="btn-action" id="modal-btn" onclick="nextChallenge()">PRÓXIMO DESAFIO 🚀</button>
        </div>
    </div>

    <script>
        // WEB AUDIO SYNTHESIZER
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'snap') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'magic') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.08);
                osc.frequency.setValueAtTime(783, now + 0.16);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.12);
                osc.frequency.setValueAtTime(783.99, now + 0.24);
                osc.frequency.setValueAtTime(1046.50, now + 0.36);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // CANVAS BACKGROUND PARTICLES
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * -1 - 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
            }
            draw() {
                ctx.fillStyle = 'rgba(245, 158, 11, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animateBg() {
            ctx.fillStyle = 'rgba(9, 13, 22, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // GAME STATE
        let mode = 'challenge'; // 'challenge' or 'sandbox'
        let targetNum = 145;
        let centenas = 0;
        let dezenas = 0;
        let unidades = 0;
        let challengeIdx = 0;

        const CHALLENGES = [
            145, 238, 57, 312, 409, 184, 520, 95, 631
        ];

        function setMode(m) {
            initAudio();
            mode = m;
            document.getElementById('tab-challenge').className = 'btn-tab' + (m === 'challenge' ? ' active' : '');
            document.getElementById('tab-sandbox').className = 'btn-tab' + (m === 'sandbox' ? ' active' : '');
            document.getElementById('target-box').style.display = m === 'challenge' ? 'block' : 'none';
            resetAll();
        }

        function addBlock(val) {
            initAudio();
            playSound('snap');
            if (val === 100) centenas++;
            if (val === 10) dezenas++;
            if (val === 1) unidades++;
            render();
            checkVictory();
        }

        function removeBlock(val) {
            initAudio();
            playSound('snap');
            if (val === 100 && centenas > 0) centenas--;
            if (val === 10 && dezenas > 0) dezenas--;
            if (val === 1 && unidades > 0) unidades--;
            render();
        }

        function autoGroup() {
            initAudio();
            let changed = false;
            if (unidades >= 10) {
                const addD = Math.floor(unidades / 10);
                unidades = unidades % 10;
                dezenas += addD;
                changed = true;
            }
            if (dezenas >= 10) {
                const addC = Math.floor(dezenas / 10);
                dezenas = dezenas % 10;
                centenas += addC;
                changed = true;
            }
            if (changed) playSound('magic');
            render();
            checkVictory();
        }

        function resetAll() {
            centenas = 0; dezenas = 0; unidades = 0;
            render();
        }

        function render() {
            const total = (centenas * 100) + (dezenas * 10) + unidades;
            document.getElementById('cnt-c').innerText = centenas;
            document.getElementById('cnt-d').innerText = dezenas;
            document.getElementById('cnt-u').innerText = unidades;
            document.getElementById('cnt-total').innerText = total;

            const ws = document.getElementById('workspace');
            ws.innerHTML = '';

            // Render Centenas (Placas)
            if (centenas > 0) {
                const cGrp = document.createElement('div');
                cGrp.className = 'block-group';
                for (let i = 0; i < centenas; i++) {
                    const p = document.createElement('div');
                    p.className = 'placa-100';
                    p.title = 'Clique para remover (-100)';
                    p.onclick = () => removeBlock(100);
                    for (let c = 0; c < 100; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell-100';
                        p.appendChild(cell);
                    }
                    cGrp.appendChild(p);
                }
                ws.appendChild(cGrp);
            }

            // Render Dezenas (Barras)
            if (dezenas > 0) {
                const dGrp = document.createElement('div');
                dGrp.className = 'block-group';
                for (let i = 0; i < dezenas; i++) {
                    const b = document.createElement('div');
                    b.className = 'barra-10';
                    b.title = 'Clique para remover (-10)';
                    b.onclick = () => removeBlock(10);
                    for (let c = 0; c < 10; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell-10';
                        b.appendChild(cell);
                    }
                    dGrp.appendChild(b);
                }
                ws.appendChild(dGrp);
            }

            // Render Unidades (Cubinhos)
            if (unidades > 0) {
                const uGrp = document.createElement('div');
                uGrp.className = 'block-group';
                for (let i = 0; i < unidades; i++) {
                    const u = document.createElement('div');
                    u.className = 'cubo-1';
                    u.title = 'Clique para remover (-1)';
                    u.onclick = () => removeBlock(1);
                    uGrp.appendChild(u);
                }
                ws.appendChild(uGrp);
            }
        }

        function checkVictory() {
            if (mode !== 'challenge') return;
            const total = (centenas * 100) + (dezenas * 10) + unidades;
            if (total === targetNum) {
                playSound('win');
                document.getElementById('modal-title').innerText = '🎉 NÚMERO ' + targetNum + ' CONSTRUÍDO!';
                document.getElementById('modal-sub').innerHTML = `
                    Excepcional!<br>Você utilizou <strong>${centenas} Placa(s)</strong>, <strong>${dezenas} Barra(s)</strong> e <strong>${unidades} Cubinho(s)</strong> para montar com precisão o número <strong>${targetNum}</strong>!
                `;
                document.getElementById('game-modal').style.display = 'flex';
            }
        }

        function nextChallenge() {
            document.getElementById('game-modal').style.display = 'none';
            challengeIdx = (challengeIdx + 1) % CHALLENGES.length;
            targetNum = CHALLENGES[challengeIdx];
            document.getElementById('target-val').innerText = targetNum;
            resetAll();
        }

        // Initialize target
        document.getElementById('target-val').innerText = targetNum;
        render();
    </script>
</body>
</html>
