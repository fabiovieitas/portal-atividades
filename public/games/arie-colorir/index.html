<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ariê Colorir | Lab Kids</title>
    <meta name="google-adsense-account" content="ca-pub-4730100335805531">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4730100335805531" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
        }

        .game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            overflow: hidden;
            z-index: 1;
        }

        .game-stage-16-9 {
            position: relative;
            width: min(100vw, calc(100dvh * 16 / 9));
            height: min(100dvh, calc(100vw * 9 / 16));
            aspect-ratio: 16 / 9;
            background: #000000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000000;
        }

        .floating-top-bar {
            position: fixed;
            top: 12px;
            left: 14px;
            right: 14px;
            z-index: 99999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .floating-top-bar > * {
            pointer-events: auto;
        }

        .btn-portal-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 9px 20px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.92rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            transition: transform 0.2s;
        }
        .btn-portal-back:hover {
            transform: scale(1.05);
        }

        .right-tools {
            display: flex;
            gap: 8px;
        }

        .btn-tool {
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            transition: background 0.2s, transform 0.2s;
        }
        .btn-tool:hover {
            background: rgba(30, 41, 59, 0.95);
            transform: scale(1.05);
        }

        .btn-tool-highlight {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border-color: #38bdf8;
            color: #ffffff;
            font-weight: 800;
        }
        .btn-tool-highlight:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
        }

        .rotate-hint {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #f59e0b;
            color: #fbbf24;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            z-index: 99999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        @media (orientation: portrait) and (max-width: 1024px) {
            .rotate-hint {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="floating-top-bar">
        <a href="/atividades/arie-colorir" class="btn-portal-back" title="Voltar ao Portal">
            ⬅️ Voltar ao Portal
        </a>

        <div class="right-tools">
            <a href="/atividades/brincando-com-arie-1" class="btn-tool btn-tool-highlight" title="Ir para Ariê 1">
                🦁 Ariê 1
            </a>
            <button type="button" class="btn-tool" onclick="toggleFullScreen()" title="Expandir para Tela Cheia">
                ⛶ Tela Cheia
            </button>
            <button type="button" class="btn-tool" onclick="reloadGame()" title="Recarregar jogo">
                🔄 Recarregar
            </button>
            <a href="https://arietoy.com.br/jogo/arie-colorir" target="_blank" rel="noopener" class="btn-tool" title="Abrir no Ariê Toy Oficial">
                🚀 Abrir Direto
            </a>
        </div>
    </div>

    <div class="rotate-hint">
        📱 Dica: Gire o tablet na horizontal para melhor visualização
    </div>

    <!-- Game 16:9 Letterbox Container -->
    <div class="game-container" id="game-container">
        <div class="game-stage-16-9">
            <iframe 
                id="arie-iframe"
                class="game-iframe"
                src="https://arietoy.com.br/assets_games/br/arie-colorir/jogo_c3.php?v=1.5.3&id=15&slug=arie-colorir"
                allow="autoplay; fullscreen; geolocation; screen-wake-lock; orientation-lock"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        function toggleFullScreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function reloadGame() {
            const iframe = document.getElementById('arie-iframe');
            if (iframe) {
                iframe.src = iframe.src;
            }
        }
    </script>
</body>
</html>
