<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gartic.io - Desenho e Adivinhação | Portal Lab Kids</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Fixed Back Button */
    .btn-return-portal {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.4);
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-return-portal:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.7);
    }

    /* Launcher Card */
    .launcher-card {
      background: rgba(30, 27, 75, 0.9);
      border: 3px solid #60a5fa;
      border-radius: 28px;
      max-width: 650px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      margin: 40px 0;
    }

    .launcher-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid #facc15;
      box-shadow: 0 10px 30px rgba(234, 179, 8, 0.4);
      object-fit: cover;
      margin-bottom: 20px;
      background: #1e293b;
      padding: 10px;
    }

    .launcher-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .launcher-desc {
      color: #cbd5e1;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-launch-direct {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #0f172a;
      font-size: 1.35rem;
      font-weight: 800;
      padding: 18px 38px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(234, 179, 8, 0.4);
      border: 2px solid #fef08a;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .btn-launch-direct:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 14px 40px rgba(234, 179, 8, 0.6);
    }

    /* AdSense Sidebars */
    .adsense-game-sidebar-left {
      position: fixed;
      left: 15px;
      top: 75px;
      width: 160px;
      height: 600px;
      z-index: 9999;
      display: none;
    }

    .adsense-game-sidebar-right {
      position: fixed;
      right: 15px;
      top: 75px;
      width: 160px;
      height: 600px;
      z-index: 9999;
      display: none;
    }

    @media (min-width: 1350px) {
      .adsense-game-sidebar-left, .adsense-game-sidebar-right {
        display: block !important;
      }
    }
  </style>
</head>
<body>

  <!-- BOTÃO FIXO DE VOLTAR AO PORTAL -->
  <a href="/atividades/gartic" class="btn-return-portal">
    ⬅️ VOLTAR AO PORTAL
  </a>

  <!-- Anúncios Laterais AdSense -->
  <div class="adsense-game-sidebar-left">
    <div style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 2px dashed #475569; border-radius: 14px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; color: white;">
      <div style="font-size: 0.7rem; color: #38bdf8; font-weight: 700; text-transform: uppercase;">📢 ADSENSE</div>
      <div style="font-size: 0.65rem; color: #94a3b8; margin-top: 4px;">Anúncios Seguros</div>
      <ins class="adsbygoogle" style="display:inline-block;width:160px;height:600px" data-ad-client="ca-pub-1234567890123456" data-ad-slot="1234567891"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>

  <div class="adsense-game-sidebar-right">
    <div style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 2px dashed #475569; border-radius: 14px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; color: white;">
      <div style="font-size: 0.7rem; color: #38bdf8; font-weight: 700; text-transform: uppercase;">📢 ADSENSE</div>
      <div style="font-size: 0.65rem; color: #94a3b8; margin-top: 4px;">Anúncios Seguros</div>
      <ins class="adsbygoogle" style="display:inline-block;width:160px;height:600px" data-ad-client="ca-pub-1234567890123456" data-ad-slot="1234567892"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>

  <!-- CARD DE INICIALIZAÇÃO DO JOGO GARTIC.IO -->
  <div class="launcher-card">
    <img src="https://gartic.io/static/images/avatar/1.png" alt="Gartic.io" class="launcher-img">
    <h1 class="launcher-title">🎨 Gartic.io - Desenho & Vocabulário</h1>
    <p class="launcher-desc">
      O Gartic.io requer abertura direta para salas em tempo real sem bloqueios. Clique no botão abaixo para entrar e se divertir desenhando!
    </p>

    <a href="https://gartic.io/" target="_blank" rel="noopener noreferrer" class="btn-launch-direct">
      🎮 ABRIR E JOGAR GARTIC.IO AGORA 🚀
    </a>
  </div>

</body>
</html>
