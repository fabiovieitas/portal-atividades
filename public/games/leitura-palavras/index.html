<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura Mágica 📖✨ | Portal de Atividades</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <a href="/" class="btn-home">⬅ Voltar ao Portal</a>
            <div class="title-container">
                <span class="icon-bounce">📖✨</span>
                <h1>Leitura Mágica</h1>
            </div>
            <div class="score-badge">
                <span>⭐ Pontos: <strong id="score">0</strong></span>
            </div>
        </header>

        <!-- Category & Level Selection -->
        <main id="setup-screen" class="screen active">
            <h2>Escolha o Nível de Leitura 🚀</h2>
            <p class="subtitle">Selecione uma categoria para começar o treino:</p>

            <div class="level-grid">
                <button class="level-card" onclick="startGame('simples')">
                    <div class="card-icon">🌱</div>
                    <h3>Palavras Simples</h3>
                    <p>BOLA, CASA, GATO, SOL, PATO, BOLO</p>
                    <span class="btn-play">JOGAR 🎮</span>
                </button>

                <button class="level-card" onclick="startGame('medias')">
                    <div class="card-icon">🚀</div>
                    <h3>Palavras Médias</h3>
                    <p>ESCOLA,BONECA,PIPOCA,JIRAFA,FUTEBOL</p>
                    <span class="btn-play">JOGAR 🎮</span>
                </button>

                <button class="level-card" onclick="startGame('desafio')">
                    <div class="card-icon">🔥</div>
                    <h3>Super Desafio</h3>
                    <p>COMPUTADOR, BORBOLETA, ASTRONAUTA, DINOSSAURO</p>
                    <span class="btn-play">JOGAR 🎮</span>
                </button>
            </div>

            <div class="speed-selector">
                <label>⏱️ Velocidade da Troca:</label>
                <select id="speed-select">
                    <option value="5000">Lento (5 segundos)</option>
                    <option value="3000" selected>Médio (3 segundos)</option>
                    <option value="2000">Rápido (2 segundos)</option>
                    <option value="manual">Manual (Clique para avançar)</option>
                </select>
            </div>
        </main>

        <!-- Game Active Screen -->
        <section id="game-screen" class="screen">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="word-card-container">
                <div class="word-card" id="word-card">
                    <div class="word-display" id="word-text">BOLA</div>
                    <button class="btn-audio" onclick="speakWord()" title="Ouvir pronúncia">🔊 Ouvir</button>
                </div>
            </div>

            <div class="game-controls">
                <button class="btn-control btn-prev" onclick="prevWord()">⬅ Anterior</button>
                <button class="btn-control btn-check" onclick="markCorrect()">✅ Já sei ler!</button>
                <button class="btn-control btn-next" onclick="nextWord()">Próxima ➡️</button>
            </div>
        </section>

        <!-- Win / Finish Screen -->
        <section id="win-screen" class="screen">
            <div class="win-card">
                <div class="win-icon">🎉🏆✨</div>
                <h2>Parabéns, Leitor Mágico!</h2>
                <p>Você completou todas as palavras da rodada!</p>
                <div class="final-score">Pontuação Final: <span id="final-score-val">0</span> ⭐</div>
                
                <div class="win-actions">
                    <button class="btn-action" onclick="restartGame()">🔄 Jogar Novamente</button>
                    <button class="btn-action btn-secondary" onclick="backToMenu()">🏠 Trocar Nível</button>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
