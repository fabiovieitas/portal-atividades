<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio dos Fatos Rápidos da Adição | Lab Kids</title>
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; border-radius: 24px; padding: 30px; border: 2px solid #ec4899; }
        .math-expr { font-size: 4rem; color: #fbbf24; font-weight: bold; margin: 20px 0; }
        .opt-btn { background: #ec4899; color: white; border: 2px solid #fff; font-size: 2rem; padding: 15px 35px; border-radius: 20px; margin: 10px; cursor: pointer; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .opt-btn:hover { background: #db2777; transform: scale(1.08); }
        .score-box { font-size: 1.3rem; color: #10b981; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Desafio Fatos da Adição até 20 ➕</h1>
        <p>Calcule mentalmente a soma e clique no resultado correto!</p>

        <div class="score-box">Pontos: <span id="score-val">0</span> ⭐</div>
        <div class="math-expr" id="expr-text">5 + 3 = ?</div>

        <div id="options-holder"></div>

        <div style="margin-top: 30px;">
            <a href="/" style="color: #94a3b8; text-decoration: none;">⬅️ Voltar ao Portal Lab Kids</a>
        </div>
    </div>

    <script>
        let n1 = 0, n2 = 0, correctAns = 0, score = 0;

        function nextQuestion() {
            n1 = Math.floor(Math.random() * 10) + 1;
            n2 = Math.floor(Math.random() * 10) + 1;
            correctAns = n1 + n2;
            document.getElementById('expr-text').innerText = n1 + ' + ' + n2 + ' = ?';

            const opts = new Set([correctAns]);
            while(opts.size < 3) {
                opts.add(Math.floor(Math.random() * 20) + 1);
            }
            const arr = Array.from(opts).sort(() => Math.random() - 0.5);

            const holder = document.getElementById('options-holder');
            holder.innerHTML = '';
            arr.forEach(val => {
                const btn = document.createElement('span');
                btn.className = 'opt-btn';
                btn.innerText = val;
                btn.onclick = () => checkAns(val);
                holder.appendChild(btn);
            });
        }

        function checkAns(val) {
            if (val === correctAns) {
                score += 10;
                document.getElementById('score-val').innerText = score;
                nextQuestion();
            } else {
                alert('Ops! Tente novamente.');
            }
        }

        nextQuestion();
    </script>
</body>
</html>
