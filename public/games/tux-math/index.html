<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tux Math - Matemática Divertida | Lab Kids</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Top Bar with Red Return Button */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 55px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid #f59e0b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 10000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.95rem;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.6);
            background: linear-gradient(135deg, #f87171, #ef4444);
        }

        .game-title {
            color: #fbbf24;
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Main Game Layout */
        .game-wrapper {
            position: absolute;
            top: 55px;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Desktop AdSense Sidebars */
        .adsense-sidebar-left {
            position: fixed;
            left: 10px;
            top: 70px;
            width: 160px;
            height: 600px;
            z-index: 9999;
            display: none;
        }

        .adsense-sidebar-right {
            position: fixed;
            right: 10px;
            top: 70px;
            width: 160px;
            height: 600px;
            z-index: 9999;
            display: none;
        }

        @media (min-width: 1450px) {
            .adsense-sidebar-left, .adsense-sidebar-right {
                display: block !important;
            }
            .game-wrapper {
                left: 180px;
                right: 180px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <a href="/atividades/tux-math" class="btn-back">
            ⬅️ VOLTAR À APRESENTAÇÃO
        </a>
        <div class="game-title">
            <span>🐧 Tux Math - Matemática Divertida</span>
        </div>
        <a href="/" class="btn-back" style="background: linear-gradient(135deg, #3b82f6, #2563eb);">
            🏠 PORTAL INICIAL
        </a>
    </div>

    <!-- AdSense Sidebars (Desktop) -->
    <div class="adsense-sidebar-left">
        <div style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 2px dashed #475569; border-radius: 14px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; color: white;">
            <div style="font-size: 0.7rem; color: #fbbf24; font-weight: 700; text-transform: uppercase;">📢 ADSENSE</div>
            <div style="font-size: 0.65rem; color: #94a3b8; margin-top: 4px;">Anúncios Seguros</div>
        </div>
    </div>

    <div class="adsense-sidebar-right">
        <div style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 2px dashed #475569; border-radius: 14px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; color: white;">
            <div style="font-size: 0.7rem; color: #fbbf24; font-weight: 700; text-transform: uppercase;">📢 ADSENSE</div>
            <div style="font-size: 0.65rem; color: #94a3b8; margin-top: 4px;">Anúncios Seguros</div>
        </div>
    </div>

    <!-- Game iframe -->
    <div class="game-wrapper">
        <iframe src="https://tuxmath.org/index-pt.html?opt_lang=pt" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
    </div>

</body>
</html>
