<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards de Leitura Dinâmica para Datashow - LabKids Pro</title>
  
  <!-- Fontes de Alta Legibilidade e Estética Infantil Premium -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Lexend+Deca:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0f172a 60%, #090d16 100%);
      --surface-glass: rgba(30, 41, 59, 0.7);
      --surface-border: rgba(56, 189, 248, 0.3);
      --primary: #38bdf8;
      --accent: #fbbf24;
      --card-bg: #ffffff;
      --card-text: #0f172a;
      --font-title: 'Fredoka', sans-serif;
      --font-body: 'Lexend Deca', sans-serif;
    }

    body.theme-light {
      --bg-gradient: radial-gradient(circle at 50% 10%, #e0f2fe 0%, #f1f5f9 60%, #e2e8f0 100%);
      --surface-glass: rgba(255, 255, 255, 0.85);
      --surface-border: rgba(148, 163, 184, 0.4);
      --primary: #0284c7;
      --accent: #d97706;
      --card-bg: #ffffff;
      --card-text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-gradient);
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body.theme-light {
      color: #0f172a;
    }

    /* TOP BAR ELEGANTE */
    .top-header {
      height: 70px;
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-glass);
      border-bottom: 2px solid var(--surface-border);
      backdrop-filter: blur(16px);
      z-index: 100;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      font-family: var(--font-title);
      font-weight: 800;
      font-size: 1.15rem;
      padding: 6px 16px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }

    .top-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid var(--surface-border);
      color: inherit;
      padding: 9px 18px;
      border-radius: 40px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    body.theme-light .btn-pill {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    .btn-pill:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.25);
    }

    .btn-danger-pill {
      background: linear-gradient(135deg, #ef4444, #dc2626) !important;
      color: white !important;
      border: none !important;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
    }

    /* TELAS */
    .view-container {
      display: none;
      flex: 1;
      width: 100%;
      height: calc(100vh - 70px);
      position: relative;
    }

    .view-container.active {
      display: flex;
      flex-direction: column;
    }

    /* TELA 1: DASHBOARD DE NÍVEIS & CONFIGURAÇÕES */
    #screen-dashboard {
      padding: 25px 40px;
      overflow-y: auto;
    }

    .dashboard-layout {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* BARRA DE CONFIGURAÇÕES RÁPIDAS NO TOPO */
    .quick-settings-panel {
      background: var(--surface-glass);
      border: 2px solid var(--surface-border);
      border-radius: 24px;
      padding: 20px 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .setting-select {
      background: rgba(15, 23, 42, 0.7);
      border: 1.5px solid var(--surface-border);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    body.theme-light .setting-select {
      background: #ffffff;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    /* GRADE DOS 10 NÍVEIS */
    .levels-masonry {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .level-card-pro {
      background: var(--surface-glass);
      border: 2px solid var(--surface-border);
      border-radius: 24px;
      padding: 22px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .level-card-pro::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #ec4899);
      opacity: 0.6;
    }

    .level-card-pro:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 16px 35px rgba(251, 191, 36, 0.25);
    }

    .card-top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-number {
      background: rgba(56, 189, 248, 0.15);
      border: 1.5px solid #38bdf8;
      color: #38bdf8;
      font-family: var(--font-title);
      font-weight: 800;
      font-size: 0.9rem;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .level-card-title {
      font-family: var(--font-title);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.25;
      margin-top: 4px;
    }

    .level-card-desc {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    body.theme-light .level-card-desc {
      color: #64748b;
    }

    /* MODAL DE SUBNÍVEL */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-sheet {
      background: #0f172a;
      border: 2px solid var(--primary);
      border-radius: 32px;
      width: 100%;
      max-width: 950px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 35px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    body.theme-light .modal-sheet {
      background: #ffffff;
      color: #0f172a;
      border-color: #0284c7;
    }

    .sublevel-grid-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin: 25px 0;
    }

    .sublevel-option-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 16px 20px;
      color: inherit;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.25s;
    }

    body.theme-light .sublevel-option-btn {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .sublevel-option-btn:hover, .sublevel-option-btn.selected {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      transform: scale(1.02);
    }

    .btn-start-reading-action {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      border-radius: 22px;
      font-family: var(--font-title);
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.45);
      transition: all 0.2s;
    }

    .btn-start-reading-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(16, 185, 129, 0.65);
    }

    /* TELA 2: ARENA DO DATASHOW */
    #screen-arena {
      display: none;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #screen-arena.active {
      display: flex;
    }

    /* TIMER DE VELOCIDADE AUTOMÁTICA (PROGRESS BAR) */
    .speed-timer-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 50;
    }

    .speed-timer-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #a855f7, #fbbf24);
      transition: width 0.1s linear;
    }

    /* O CARTÃO GIGANTE DE LEITURA */
    .reading-stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .card-grand-pro {
      background: var(--card-bg);
      color: var(--card-text);
      border-radius: 45px;
      padding: 3.5rem 4rem;
      width: 90vw;
      max-width: 1250px;
      min-height: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.65), 0 0 50px rgba(56, 189, 248, 0.25);
      text-align: center;
      position: relative;
      animation: cardPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes cardPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .word-illustration {
      font-size: clamp(4.5rem, 11vw, 8rem);
      margin-bottom: 15px;
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.18));
      animation: floatSmooth 3.2s ease-in-out infinite;
    }

    @keyframes floatSmooth {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .word-headline {
      font-family: var(--font-title);
      font-size: clamp(5rem, 12vw, 10.5rem);
      font-weight: 700;
      color: #0f172a;
      line-height: 1.05;
      letter-spacing: 2px;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* SÍLABAS COM CORES DISTINTAS VIBRANTES */
    .syl-colored {
      display: inline-block;
      padding: 6px 24px;
      border-radius: 28px;
      font-weight: 800;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
      border: 3.5px solid transparent;
      transition: all 0.25s ease;
    }

    /* Paleta Educacional de Alto Contraste */
    .syl-c0 { background: #e0f2fe; color: #0284c7; border-color: #38bdf8; } /* Azul Céu */
    .syl-c1 { background: #fef3c7; color: #b45309; border-color: #fbbf24; } /* Âmbar Solar */
    .syl-c2 { background: #fce7f3; color: #be185d; border-color: #f472b6; } /* Rosa Vibrante */
    .syl-c3 { background: #dcfce7; color: #15803d; border-color: #4ade80; } /* Verde Esmeralda */
    .syl-c4 { background: #ede9fe; color: #6d28d9; border-color: #a78bfa; } /* Roxo Mágico */
    .syl-c5 { background: #ffedd5; color: #c2410c; border-color: #fb923c; } /* Laranja */

    .word-meaning-hint {
      font-size: 1.6rem;
      color: #64748b;
      font-weight: 600;
    }

    /* BARRA FLUTUANTE DE CONTROLES NO DATASHOW */
    .dock-controls-bar {
      position: absolute;
      bottom: 25px;
      display: flex;
      gap: 14px;
      align-items: center;
      background: rgba(15, 23, 42, 0.88);
      padding: 10px 25px;
      border-radius: 50px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.55);
      z-index: 100;
    }

    .dock-action-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .dock-action-btn:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-2px);
    }

    .dock-btn-forward {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #34d399;
      font-size: 1.15rem;
      padding: 10px 32px;
    }
  </style>
</head>
<body>

  <!-- BARRA DE TOPO ELEGANTE -->
  <header class="top-header">
    <div class="brand-box">
      <a href="/" class="btn-pill btn-danger-pill">⬅️ Voltar ao Portal</a>
      <span class="brand-badge" id="hud-activity-badge">⭐ Leitura Coletiva no Datashow</span>
    </div>
    <div class="top-actions">
      <button class="btn-pill" onclick="toggleThemeGlobal()" title="Alternar Modo Escuro / Claro">🌓 Tema</button>
      <button class="btn-pill" id="btn-soundtrack" onclick="toggleAudioBGM()" title="Trilha Sonora Instrumental MP3">🎵 Música: Ativa</button>
      <button class="btn-pill" onclick="toggleFullScreen()" title="Modo Tela Cheia">⛶ Tela Cheia</button>
    </div>
  </header>

  <!-- TELA 1: DASHBOARD COM CONFIGURAÇÕES COMPLETAS -->
  <main id="screen-dashboard" class="view-container active">
    <div class="dashboard-layout">
      
      <!-- PAINEL DE CONFIGURAÇÕES RÁPIDAS -->
      <section class="quick-settings-panel">
        
        <!-- Velocidade Automática -->
        <div class="setting-item">
          <label class="setting-label">⏱️ Velocidade Automática:</label>
          <select id="config-speed" class="setting-select" onchange="onSpeedChange()">
            <option value="manual">Manual (Espaço / Setas)</option>
            <option value="3">Automático (3 segundos) ⚡</option>
            <option value="5">Automático (5 segundos) 🚀</option>
            <option value="7">Automático (7 segundos) 🎯</option>
            <option value="10" selected>Automático (10 segundos) ⏳</option>
            <option value="15">Automático (15 segundos) 🐢</option>
          </select>
        </div>

        <!-- Modo das Palavras / Sílabas -->
        <div class="setting-item">
          <label class="setting-label">✂️ Divisão Silábica Colorida:</label>
          <select id="config-syllables" class="setting-select">
            <option value="colored" selected>Colorida em Cores Vivas (Recomendado)</option>
            <option value="plain">Apenas Palavra Inteira</option>
          </select>
        </div>

        <!-- Exibição de Imagem/Emoji -->
        <div class="setting-item">
          <label class="setting-label">🖼️ Ilustrações / Emojis:</label>
          <select id="config-image" class="setting-select">
            <option value="yes" selected>Exibir Emojis e Dicas 🍎</option>
            <option value="no">Apenas Texto Gigante 🔤</option>
          </select>
        </div>

        <!-- Volume da Música MP3 -->
        <div class="setting-item">
          <label class="setting-label">🔊 Volume da Trilha MP3:</label>
          <select id="config-volume" class="setting-select" onchange="onVolumeChange(this.value)">
            <option value="0.15">Suave (15%)</option>
            <option value="0.30" selected>Normal (30%)</option>
            <option value="0.50">Forte (50%)</option>
            <option value="0.0">Mudo</option>
          </select>
        </div>

      </section>

      <!-- GRADE DOS 10 NÍVEIS -->
      <h2 style="font-family: var(--font-title); font-size: 1.6rem; color: var(--accent);">
        📚 Escolha o Nível da Turma:
      </h2>
      <div class="levels-masonry" id="levels-masonry-list">
        <!-- Renderizado dinamicamente -->
      </div>

    </div>
  </main>

  <!-- MODAL DE SUBNÍVEL & INÍCIO -->
  <div class="modal-backdrop" id="modal-sublevel-picker">
    <div class="modal-sheet">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 id="picker-level-name" style="font-family: var(--font-title); color: var(--primary); font-size: 2rem;">
          Nível
        </h2>
        <button class="btn-pill btn-danger-pill" onclick="closePickerModal()">✖ Fechar</button>
      </div>
      <p style="color: #94a3b8; font-size: 1.05rem; margin-top: 5px;">
        Clique no subnível desejado e pressione o botão para projetar no Datashow:
      </p>

      <!-- Grade de Subníveis -->
      <div class="sublevel-grid-options" id="picker-sublevels-grid"></div>

      <!-- BOTÃO INICIAR -->
      <button class="btn-start-reading-action" onclick="launchDatashowArena()">
        ▶️ INICIAR ATIVIDADE NO DATASHOW
      </button>
    </div>
  </div>

  <!-- TELA 2: ARENA DO DATASHOW -->
  <main id="screen-arena" class="view-container">
    
    <!-- Barra de Progresso do Tempo Automático -->
    <div class="speed-timer-bar-container">
      <div class="speed-timer-progress" id="speed-progress-bar"></div>
    </div>

    <div class="reading-stage">
      
      <!-- O CARTÃO GIGANTE -->
      <div class="card-grand-pro" id="datashow-card">
        <div class="word-illustration" id="word-illustration">🍎</div>
        <div class="word-headline" id="word-headline">MAÇÃ</div>
        <div class="word-meaning-hint" id="word-meaning-hint">Fruta vermelha e saborosa</div>
      </div>

      <!-- BARRA DE CONTROLE FLUTUANTE -->
      <footer class="dock-controls-bar">
        <button class="dock-action-btn" onclick="exitArenaToDashboard()" title="Voltar aos Níveis">🏠 Níveis</button>
        <button class="dock-action-btn" onclick="navCard(-1)" title="Palavra Anterior">⬅️ Anterior</button>
        <button class="dock-action-btn" id="dock-pause-btn" onclick="togglePauseAutoSpeed()" title="Pausar / Retomar">⏸️ Pausar</button>
        <button class="dock-action-btn" id="dock-syllable-btn" onclick="toggleSyllableColoring()">✂️ Sílabas</button>
        <button class="dock-action-btn" onclick="toggleCardImage()">👁️ Imagem</button>
        <button class="dock-action-btn dock-btn-forward" onclick="navCard(1)">Próxima ➡️</button>
      </footer>

    </div>
  </main>

  <!-- ÁUDIO MP3 REAL AMBIENTE -->
  <audio id="audio-bgm" loop preload="auto">
    <source src="assets/reading-theme.mp3" type="audio/mp3">
  </audio>

  <!-- BANCO DE PALAVRAS E MOTOR -->
  <script src="words-data.js?v=8.3"></script>
  <script>
    // ESTADO GLOBAL
    let selectedLevelIndex = 1;
    let selectedSublevelCode = '1.1';
    let activeDeck = [];
    let currentCardIndex = 0;
    
    let isSyllablesActive = true;
    let isImageVisible = true;
    let isBgmPlaying = true;
    let isAutoPaused = false;
    
    let autoIntervalId = null;
    let autoProgressIntervalId = null;
    let autoSpeedSeconds = 10;
    let progressElapsedMs = 0;

    const bgmAudio = document.getElementById('audio-bgm');
    bgmAudio.volume = 0.30;

    // INICIALIZAÇÃO
    window.addEventListener('DOMContentLoaded', () => {
      renderDashboardLevels();

      // Desbloqueio seguro de áudio
      const unlockAudio = () => {
        if (isBgmPlaying) bgmAudio.play().catch(() => {});
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
      };
      window.addEventListener('click', unlockAudio, { once: true });
      window.addEventListener('keydown', unlockAudio, { once: true });

      // Teclas de Atalho
      window.addEventListener('keydown', (e) => {
        if (document.getElementById('screen-arena').classList.contains('active')) {
          if (e.key === ' ' || e.key === 'ArrowRight') navCard(1);
          if (e.key === 'ArrowLeft') navCard(-1);
          if (e.key.toLowerCase() === 'p') togglePauseAutoSpeed();
          if (e.key.toLowerCase() === 'm') toggleAudioBGM();
          if (e.key.toLowerCase() === 'f') toggleFullScreen();
          if (e.key.toLowerCase() === 'd') toggleSyllableColoring();
          if (e.key === 'Escape') exitArenaToDashboard();
        }
      });
    });

    // RENDERIZAR OS 10 NÍVEIS
    function renderDashboardLevels() {
      const container = document.getElementById('levels-masonry-list');
      container.innerHTML = '';

      for (let lvl = 1; lvl <= 10; lvl++) {
        const info = WORDS_DATABASE[lvl];
        if (!info) continue;

        const card = document.createElement('div');
        card.className = 'level-card-pro';
        card.innerHTML = `
          <div class="card-top-info">
            <span class="badge-number">Nível ${lvl}</span>
            <span style="font-size: 1.3rem;">✨</span>
          </div>
          <div>
            <h3 class="level-card-title">${info.title.split(':')[1] || info.title}</h3>
            <p class="level-card-desc">${info.description || 'Prática de leitura coletiva e decodificação fluente.'}</p>
          </div>
        `;

        card.onclick = () => openPickerModal(lvl);
        container.appendChild(card);
      }
    }

    // MODAL DE SUBNÍVEL
    function openPickerModal(level) {
      selectedLevelIndex = level;
      const info = WORDS_DATABASE[level];
      if (!info || !info.sublevels) return;

      document.getElementById('picker-level-name').textContent = `Nível ${level}: Escolha o Subnível`;
      const grid = document.getElementById('picker-sublevels-grid');
      grid.innerHTML = '';

      const keys = Object.keys(info.sublevels);
      selectedSublevelCode = keys[0];

      keys.forEach((k, idx) => {
        const sub = info.sublevels[k];
        const btn = document.createElement('button');
        btn.className = `sublevel-option-btn ${idx === 0 ? 'selected' : ''}`;
        btn.innerHTML = `
          <strong style="color: var(--primary); font-size: 1.1rem;">Subnível ${k}</strong>
          <span>${sub.title.split(':')[1] || sub.title}</span>
          <small style="color: #94a3b8; font-size: 0.8rem; margin-top: 4px;">(${sub.items.length} palavras disponíveis)</small>
        `;

        btn.onclick = () => {
          document.querySelectorAll('.sublevel-option-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedSublevelCode = k;
        };

        grid.appendChild(btn);
      });

      document.getElementById('modal-sublevel-picker').classList.add('active');
    }

    function closePickerModal() {
      document.getElementById('modal-sublevel-picker').classList.remove('active');
    }

    // INICIAR ATIVIDADE
    function launchDatashowArena() {
      closePickerModal();
      const info = WORDS_DATABASE[selectedLevelIndex];
      if (!info || !info.sublevels || !info.sublevels[selectedSublevelCode]) return;

      activeDeck = [...info.sublevels[selectedSublevelCode].items];
      currentCardIndex = 0;

      // Aplicar configurações selecionadas
      isSyllablesActive = document.getElementById('config-syllables').value === 'colored';
      isImageVisible = document.getElementById('config-image').value === 'yes';

      document.getElementById('screen-dashboard').classList.remove('active');
      document.getElementById('screen-arena').classList.add('active');
      document.getElementById('hud-activity-badge').textContent = `⭐ Nível ${selectedLevelIndex} - Subnível ${selectedSublevelCode}`;

      if (isBgmPlaying) bgmAudio.play().catch(() => {});
      
      displayCurrentCardPro();
      startAutoSpeedTimer();
    }

    function exitArenaToDashboard() {
      clearAutoSpeedTimer();
      document.getElementById('screen-arena').classList.remove('active');
      document.getElementById('screen-dashboard').classList.add('active');
      document.getElementById('hud-activity-badge').textContent = '⭐ Leitura Coletiva no Datashow';
    }

    // EXIBIR O CARD COM SÍLABAS COLORIDAS VIBRANTES
    function displayCurrentCardPro() {
      if (!activeDeck.length) return;
      const item = activeDeck[currentCardIndex];
      const card = document.getElementById('datashow-card');

      card.style.animation = 'none';
      card.offsetHeight; // Reflow
      card.style.animation = 'cardPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';

      // Emoji
      const illusElem = document.getElementById('word-illustration');
      illusElem.textContent = item.image || '📖';
      illusElem.style.display = isImageVisible ? 'block' : 'none';

      // Palavra ou Sílabas Coloridas
      const wordElem = document.getElementById('word-headline');
      if (isSyllablesActive && item.syllables && item.syllables.length > 1) {
        wordElem.innerHTML = item.syllables.map((syl, i) => {
          const colorClass = `syl-c${i % 6}`;
          return `<span class="syl-colored ${colorClass}">${syl}</span>`;
        }).join('');
      } else {
        wordElem.textContent = item.text;
      }

      // Dica
      document.getElementById('word-meaning-hint').textContent = item.hint || '';
    }

    // NAVEGAÇÃO ENTRE CARDS
    function navCard(direction) {
      if (direction === 1) {
        if (currentCardIndex < activeDeck.length - 1) {
          currentCardIndex++;
        } else {
          currentCardIndex = 0;
          if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 80, origin: { y: 0.7 } });
        }
      } else {
        if (currentCardIndex > 0) currentCardIndex--;
      }
      displayCurrentCardPro();
      resetAutoSpeedProgress();
    }

    // CONTROLE DE VELOCIDADE AUTOMÁTICA
    function onSpeedChange() {
      const val = document.getElementById('config-speed').value;
      autoSpeedSeconds = val === 'manual' ? null : parseInt(val);
      if (document.getElementById('screen-arena').classList.contains('active')) {
        startAutoSpeedTimer();
      }
    }

    function startAutoSpeedTimer() {
      clearAutoSpeedTimer();
      const speedVal = document.getElementById('config-speed').value;
      if (speedVal === 'manual') {
        document.getElementById('speed-progress-bar').style.width = '0%';
        return;
      }

      autoSpeedSeconds = parseInt(speedVal) || 10;
      progressElapsedMs = 0;
      isAutoPaused = false;
      document.getElementById('dock-pause-btn').textContent = '⏸️ Pausar';

      const totalMs = autoSpeedSeconds * 1000;
      const stepMs = 50;

      autoProgressIntervalId = setInterval(() => {
        if (!isAutoPaused) {
          progressElapsedMs += stepMs;
          const pct = Math.min(100, (progressElapsedMs / totalMs) * 100);
          document.getElementById('speed-progress-bar').style.width = `${pct}%`;

          if (progressElapsedMs >= totalMs) {
            navCard(1);
          }
        }
      }, stepMs);
    }

    function resetAutoSpeedProgress() {
      progressElapsedMs = 0;
      document.getElementById('speed-progress-bar').style.width = '0%';
    }

    function clearAutoSpeedTimer() {
      if (autoProgressIntervalId) clearInterval(autoProgressIntervalId);
      autoProgressIntervalId = null;
      document.getElementById('speed-progress-bar').style.width = '0%';
    }

    function togglePauseAutoSpeed() {
      isAutoPaused = !isAutoPaused;
      document.getElementById('dock-pause-btn').textContent = isAutoPaused ? '▶️ Continuar' : '⏸️ Pausar';
    }

    // BOTÕES DE CONTROLE
    function toggleSyllableColoring() {
      isSyllablesActive = !isSyllablesActive;
      document.getElementById('dock-syllable-btn').style.background = isSyllablesActive ? 'var(--primary)' : 'rgba(255,255,255,0.1)';
      document.getElementById('dock-syllable-btn').style.color = isSyllablesActive ? '#0f172a' : 'white';
      displayCurrentCardPro();
    }

    function toggleCardImage() {
      isImageVisible = !isImageVisible;
      displayCurrentCardPro();
    }

    function toggleAudioBGM() {
      isBgmPlaying = !isBgmPlaying;
      const btn = document.getElementById('btn-soundtrack');
      if (isBgmPlaying) {
        bgmAudio.play().catch(() => {});
        btn.textContent = '🎵 Música: Ativa';
      } else {
        bgmAudio.pause();
        btn.textContent = '🔇 Música: Desativada';
      }
    }

    function onVolumeChange(val) {
      bgmAudio.volume = parseFloat(val);
    }

    function toggleThemeGlobal() {
      document.body.classList.toggle('theme-light');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }
  </script>
</body>
</html>
