<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitura Interativa no Datashow - LabKids</title>
  
  <!-- Fontes Educacionais Modernas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend+Deca:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-panel: rgba(18, 26, 43, 0.95);
      --border-panel: rgba(56, 189, 248, 0.25);
      --primary: #38bdf8;
      --accent: #fbbf24;
      --card-bg: #ffffff;
      --card-text: #0f172a;
      --font-main: 'Lexend Deca', sans-serif;
      --font-display: 'Fredoka', sans-serif;
    }

    body.theme-light {
      --bg-dark: #f0f4f8;
      --bg-panel: rgba(255, 255, 255, 0.95);
      --border-panel: rgba(148, 163, 184, 0.35);
      --primary: #0284c7;
      --accent: #d97706;
      --card-bg: #ffffff;
      --card-text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg-dark);
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body.theme-light {
      color: #0f172a;
    }

    /* HEADER SUPERIOR */
    .top-bar {
      height: 65px;
      padding: 0 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
      border-bottom: 2px solid var(--border-panel);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .top-left, .top-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid var(--border-panel);
      color: inherit;
      padding: 8px 16px;
      border-radius: 30px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    body.theme-light .btn-action {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626) !important;
      color: white !important;
      border: none !important;
    }

    /* TELAS */
    .screen-view {
      display: none;
      flex: 1;
      width: 100%;
      height: calc(100vh - 65px);
      position: relative;
    }

    .screen-view.active {
      display: flex;
      flex-direction: column;
    }

    /* TELA 1: SELEÇÃO DE NÍVEIS & MODOS */
    #view-setup {
      padding: 20px 40px;
      overflow-y: auto;
      align-items: center;
    }

    .setup-container {
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hero-banner {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(168, 85, 247, 0.15));
      border: 2px solid var(--primary);
      border-radius: 24px;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .hero-title h1 {
      font-family: var(--font-display);
      font-size: 2.2rem;
      color: var(--primary);
    }

    .hero-title p {
      font-size: 1.05rem;
      color: #94a3b8;
    }

    body.theme-light .hero-title p {
      color: #64748b;
    }

    /* CARDS DE NÍVEIS */
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      width: 100%;
    }

    .level-card {
      background: var(--bg-panel);
      border: 2px solid var(--border-panel);
      border-radius: 20px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .level-card:hover, .level-card.selected {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(251, 191, 36, 0.2);
    }

    .level-badge {
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .level-name {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .level-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.35;
    }

    body.theme-light .level-desc {
      color: #64748b;
    }

    /* MODAL DE SUBNÍVEL & CONFIGURAÇÕES */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #0f172a;
      border: 2px solid var(--primary);
      border-radius: 28px;
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
    }

    body.theme-light .modal-box {
      background: #ffffff;
      color: #0f172a;
    }

    .sublevels-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .sublevel-item {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 18px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    body.theme-light .sublevel-item {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .sublevel-item:hover, .sublevel-item.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      color: var(--primary);
      transform: scale(1.02);
    }

    .btn-launch {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      border-radius: 20px;
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }

    .btn-launch:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.6);
    }

    /* TELA 2: ARENA DE LEITURA NO DATASHOW */
    #view-presentation {
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
    }

    .card-stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .word-card-box {
      background: var(--card-bg);
      color: var(--card-text);
      border-radius: 40px;
      padding: 3rem 4rem;
      width: 90vw;
      max-width: 1200px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 40px rgba(56, 189, 248, 0.2);
      text-align: center;
      position: relative;
      animation: cardZoomIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes cardZoomIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .card-emoji {
      font-size: clamp(4rem, 10vw, 7.5rem);
      margin-bottom: 15px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
      animation: gentleFloat 3s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .word-text-large {
      font-family: var(--font-display);
      font-size: clamp(4.5rem, 11vw, 9.5rem);
      font-weight: 700;
      color: #0f172a;
      line-height: 1.1;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    /* SÍLABAS COLORIDAS */
    .syllable-pill {
      display: inline-block;
      padding: 4px 18px;
      margin: 0 6px;
      border-radius: 20px;
      background: #e0f2fe;
      color: #0369a1;
      border: 3px solid #38bdf8;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: transform 0.2s;
    }

    .syllable-pill:nth-child(even) {
      background: #fef3c7;
      color: #b45309;
      border-color: #f59e0b;
    }

    .card-hint {
      font-size: 1.5rem;
      color: #64748b;
      font-weight: 600;
    }

    /* BARRA INFERIOR DE CONTROLES DO DATASHOW */
    .controls-dock {
      position: absolute;
      bottom: 25px;
      display: flex;
      gap: 15px;
      background: rgba(15, 23, 42, 0.88);
      padding: 10px 25px;
      border-radius: 40px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .dock-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .dock-btn:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-2px);
    }

    .dock-btn-next {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #34d399;
      font-size: 1.15rem;
      padding: 10px 30px;
    }
  </style>
</head>
<body>

  <!-- BARRA DE TOPO PROFISSIONAL -->
  <header class="top-bar">
    <div class="top-left">
      <a href="/" class="btn-action btn-danger">⬅️ Voltar ao Portal</a>
      <span id="current-title-badge" style="font-weight: 800; color: var(--accent); font-size: 1.05rem;">
        ⭐ Leitura Interativa Datashow
      </span>
    </div>
    <div class="top-right">
      <button class="btn-action" onclick="toggleThemeMode()" title="Alternar Modo Escuro / Claro">🌓 Tema</button>
      <button class="btn-action" id="btn-toggle-music" onclick="toggleBGMTrack()" title="Música Ambiente MP3">🎵 Música: Ligada</button>
      <button class="btn-action" onclick="toggleFullScreen()" title="Modo Tela Cheia">⛶ Tela Cheia</button>
    </div>
  </header>

  <!-- TELA 1: SELETOR DE NÍVEL & MODAL MODERNO -->
  <main id="view-setup" class="screen-view active">
    <div class="setup-container">
      
      <div class="hero-banner">
        <div class="hero-title">
          <h1>⭐ Leitura Coletiva no Datashow ⭐</h1>
          <p>Selecione um nível para iniciar a atividade interativa na lousa ou tela grande.</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <label style="font-weight: 700; font-size: 0.95rem;">Modo de Leitura:</label>
          <select id="game-mode-select" class="btn-action" style="padding: 10px 15px; background: rgba(0,0,0,0.3);">
            <option value="cards" selected>📺 Cards Gigantes de Leitura</option>
            <option value="flash">⚡ Leitura Rápida / Flash</option>
            <option value="syllables">🔊 Destaque Silábico Guiado</option>
          </select>
        </div>
      </div>

      <!-- GRID DOS 10 NÍVEIS -->
      <div class="levels-grid" id="levels-grid-container">
        <!-- Inserido dinamicamente via script -->
      </div>

    </div>
  </main>

  <!-- MODAL DE SUBNÍVEL (CLIQUE EM QUALQUER NÍVEL PARA ABRIR) -->
  <div class="modal-overlay" id="sublevels-modal">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 id="modal-level-title" style="font-family: var(--font-display); color: var(--primary); font-size: 1.8rem;">
          Nível Selecionado
        </h2>
        <button class="btn-action btn-danger" onclick="closeSublevelModal()">✖ Fechar</button>
      </div>
      <p style="color: #94a3b8; font-size: 1rem; margin-bottom: 20px;">
        Escolha o subnível para carregar as palavras da aula:
      </p>

      <div class="sublevels-list" id="sublevels-container">
        <!-- Gerado via script -->
      </div>

      <!-- BOTÃO VERDE TOTALMENTE FUNCIONAL -->
      <button class="btn-launch" id="btn-start-presentation" onclick="startReadingArena()">
        ▶️ INICIAR ATIVIDADE NO DATASHOW
      </button>
    </div>
  </div>

  <!-- TELA 2: ARENA DE APRESENTAÇÃO NO DATASHOW -->
  <main id="view-presentation" class="screen-view">
    <div class="card-stage">
      
      <div class="word-card-box" id="presentation-card">
        <div class="card-emoji" id="card-emoji">🍎</div>
        <div class="word-text-large" id="card-word">MAÇÃ</div>
        <div class="card-hint" id="card-hint">Fruta vermelha e saborosa</div>
      </div>

      <!-- CONTROLES FLUTUANTES DO PROFESSOR -->
      <footer class="controls-dock">
        <button class="dock-btn" onclick="backToMenu()" title="Voltar ao Menu Principal">🏠 Níveis</button>
        <button class="dock-btn" onclick="prevWord()" title="Palavra Anterior">⬅️ Anterior</button>
        <button class="dock-btn" id="btn-toggle-syllable" onclick="toggleSyllableMode()">✂️ Sílabas</button>
        <button class="dock-btn" id="btn-toggle-img" onclick="toggleImageDisplay()">👁️ Imagem</button>
        <button class="dock-btn dock-btn-next" onclick="nextWord()">Próxima ➡️</button>
      </footer>

    </div>
  </main>

  <!-- ÁUDIO MP3 AMBIENTE DE QUALIDADE -->
  <audio id="bgm-player" loop preload="auto">
    <source src="assets/reading-theme.mp3" type="audio/mp3">
  </audio>

  <!-- BANCO DE PALAVRAS E CONTROLADOR -->
  <script src="words-data.js?v=8.2"></script>
  <script>
    // ESTADO DO JOGO
    let currentLevel = 1;
    let currentSublevel = '1.1';
    let currentDeck = [];
    let currentIndex = 0;
    let showSyllables = false;
    let showImage = true;
    let bgmEnabled = true;

    const bgmPlayer = document.getElementById('bgm-player');
    bgmPlayer.volume = 0.25;

    // INICIALIZAÇÃO
    window.addEventListener('DOMContentLoaded', () => {
      renderLevels();

      // Desbloqueio seguro de áudio
      const unlock = () => {
        if (bgmEnabled) bgmPlayer.play().catch(() => {});
        window.removeEventListener('click', unlock);
        window.removeEventListener('keydown', unlock);
      };
      window.addEventListener('click', unlock, { once: true });
      window.addEventListener('keydown', unlock, { once: true });

      // Atalhos de teclado
      window.addEventListener('keydown', (e) => {
        if (document.getElementById('view-presentation').classList.contains('active')) {
          if (e.key === ' ' || e.key === 'ArrowRight') nextWord();
          if (e.key === 'ArrowLeft') prevWord();
          if (e.key.toLowerCase() === 'm') toggleBGMTrack();
          if (e.key.toLowerCase() === 'f') toggleFullScreen();
          if (e.key.toLowerCase() === 'd') toggleSyllableMode();
          if (e.key.toLowerCase() === 'i') toggleImageDisplay();
          if (e.key === 'Escape') backToMenu();
        }
      });
    });

    // RENDERIZAR OS 10 NÍVEIS
    function renderLevels() {
      const container = document.getElementById('levels-grid-container');
      container.innerHTML = '';

      for (let lvl = 1; lvl <= 10; lvl++) {
        const data = WORDS_DATABASE[lvl];
        if (!data) continue;

        const card = document.createElement('div');
        card.className = `level-card ${lvl === currentLevel ? 'selected' : ''}`;
        card.innerHTML = `
          <span class="level-badge">Nível ${lvl}</span>
          <h3 class="level-name">${data.title.split(':')[1] || data.title}</h3>
          <p class="level-desc">${data.description || 'Atividade dinâmica de leitura coletiva.'}</p>
        `;

        card.onclick = () => openSublevelModal(lvl);
        container.appendChild(card);
      }
    }

    // ABRIR MODAL COM OS SUBNÍVEIS
    function openSublevelModal(level) {
      currentLevel = level;
      const data = WORDS_DATABASE[level];
      if (!data || !data.sublevels) return;

      document.getElementById('modal-level-title').textContent = data.title;
      const subContainer = document.getElementById('sublevels-container');
      subContainer.innerHTML = '';

      const subKeys = Object.keys(data.sublevels);
      currentSublevel = subKeys[0];

      subKeys.forEach((key, idx) => {
        const sub = data.sublevels[key];
        const btn = document.createElement('button');
        btn.className = `sublevel-item ${idx === 0 ? 'active' : ''}`;
        btn.innerHTML = `<strong>Subnível ${key}:</strong> ${sub.title.split(':')[1] || sub.title} <small>(${sub.items.length} palavras)</small>`;
        
        btn.onclick = () => {
          document.querySelectorAll('.sublevel-item').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSublevel = key;
        };

        subContainer.appendChild(btn);
      });

      document.getElementById('sublevels-modal').classList.add('active');
    }

    function closeSublevelModal() {
      document.getElementById('sublevels-modal').classList.remove('active');
    }

    // INICIAR A ARENA DO DATASHOW
    function startReadingArena() {
      closeSublevelModal();
      const data = WORDS_DATABASE[currentLevel];
      if (!data || !data.sublevels || !data.sublevels[currentSublevel]) return;

      currentDeck = [...data.sublevels[currentSublevel].items];
      currentIndex = 0;

      document.getElementById('view-setup').classList.remove('active');
      document.getElementById('view-presentation').classList.add('active');

      document.getElementById('current-title-badge').textContent = `⭐ Nível ${currentLevel} - Subnível ${currentSublevel}`;

      if (bgmEnabled) bgmPlayer.play().catch(() => {});
      displayCurrentCard();
    }

    function backToMenu() {
      document.getElementById('view-presentation').classList.remove('active');
      document.getElementById('view-setup').classList.add('active');
      document.getElementById('current-title-badge').textContent = '⭐ Leitura Interativa Datashow';
    }

    // EXIBIR CARTÃO ATUAL
    function displayCurrentCard() {
      if (!currentDeck.length) return;
      const item = currentDeck[currentIndex];
      const card = document.getElementById('presentation-card');

      card.style.animation = 'none';
      card.offsetHeight; // Reflow
      card.style.animation = 'cardZoomIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';

      // Emoji
      const emojiElem = document.getElementById('card-emoji');
      emojiElem.textContent = item.image || '📖';
      emojiElem.style.display = showImage ? 'block' : 'none';

      // Palavra ou Sílabas
      const wordElem = document.getElementById('card-word');
      if (showSyllables && item.syllables && item.syllables.length > 1) {
        wordElem.innerHTML = item.syllables.map(s => `<span class="syllable-pill">${s}</span>`).join('');
      } else {
        wordElem.textContent = item.text;
      }

      // Dica
      document.getElementById('card-hint').textContent = item.hint || '';
    }

    function nextWord() {
      if (currentIndex < currentDeck.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0; // Loop contínuo para dinamismo
        triggerConfetti();
      }
      displayCurrentCard();
    }

    function prevWord() {
      if (currentIndex > 0) {
        currentIndex--;
        displayCurrentCard();
      }
    }

    function toggleSyllableMode() {
      showSyllables = !showSyllables;
      document.getElementById('btn-toggle-syllable').style.background = showSyllables ? 'var(--primary)' : 'rgba(255,255,255,0.1)';
      document.getElementById('btn-toggle-syllable').style.color = showSyllables ? '#0f172a' : 'white';
      displayCurrentCard();
    }

    function toggleImageDisplay() {
      showImage = !showImage;
      document.getElementById('btn-toggle-img').style.background = showImage ? 'var(--primary)' : 'rgba(255,255,255,0.1)';
      document.getElementById('btn-toggle-img').style.color = showImage ? '#0f172a' : 'white';
      displayCurrentCard();
    }

    function toggleBGMTrack() {
      bgmEnabled = !bgmEnabled;
      const btn = document.getElementById('btn-toggle-music');
      if (bgmEnabled) {
        bgmPlayer.play().catch(() => {});
        btn.textContent = '🎵 Música: Ligada';
      } else {
        bgmPlayer.pause();
        btn.textContent = '🔇 Música: Desligada';
      }
    }

    function toggleThemeMode() {
      document.body.classList.toggle('theme-light');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
      }
    }
  </script>
</body>
</html>
