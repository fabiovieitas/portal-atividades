<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Agente da Saúde 3D: Batalha Contra os Germes! | Lab Kids</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Fredoka', sans-serif;
            background: #060913;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 15px;
        }

        #game-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: auto;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .interactive-card {
            pointer-events: auto;
            width: 100%;
            background: rgba(15, 23, 42, 0.92);
            border: 3px solid #06b6d4;
            border-radius: 28px;
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.35), inset 0 0 20px rgba(6, 182, 212, 0.15);
            backdrop-filter: blur(14px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* HEADER STATS */
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.85);
            border: 2px solid #334155;
            padding: 12px 20px;
            border-radius: 20px;
            margin-bottom: 18px;
        }

        .badge-stage {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #fff;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
        }

        .stat-box { display: flex; gap: 20px; font-size: 1.15rem; font-weight: 800; }
        .val-score { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.6); }
        .val-combo { color: #ec4899; }

        /* TAB NAVIGATION (MINI-GAMES & RANKING) */
        .nav-tabs {
            display: flex;
            gap: 10px;
            background: #0f172a;
            padding: 6px;
            border-radius: 50px;
            border: 1px solid #334155;
            margin-bottom: 18px;
            pointer-events: auto;
        }
        .btn-tab {
            padding: 10px 20px;
            border-radius: 50px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-tab.active {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #fff;
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
        }

        /* PLAYGROUND STAGE CONTAINER */
        .play-area {
            width: 100%;
            min-height: 380px;
            background: rgba(9, 13, 22, 0.9);
            border: 2px solid #38bdf8;
            border-radius: 22px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* MINI-GAME 1: SCRUB GERMS */
        .scrub-hand-container {
            width: 280px; height: 280px;
            background: radial-gradient(circle, #38bdf8 0%, #0369a1 100%);
            border-radius: 50%;
            border: 4px solid #fff;
            position: relative;
            cursor: crosshair;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.5);
        }
        .germ-target {
            position: absolute;
            font-size: 3rem;
            cursor: pointer;
            transition: transform 0.1s ease;
            animation: pulseGerm 1.5s infinite ease-in-out;
        }
        @keyframes pulseGerm {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.15) rotate(10deg); }
        }

        /* MINI-GAME 2: TOOTH BRUSHING */
        .teeth-container {
            display: flex;
            gap: 12px;
            background: #1e293b;
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #f43f5e;
        }
        .tooth-unit {
            width: 55px; height: 75px;
            background: #f8fafc;
            border-radius: 12px 12px 20px 20px;
            border: 3px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.1);
        }
        .tooth-plaque {
            width: 80%; height: 60%;
            background: rgba(180, 83, 9, 0.85);
            border-radius: 8px;
            position: absolute;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* QUIZ OPTIONS */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
            margin-top: 15px;
        }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

        .btn-opt {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 14px 18px;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        .btn-opt:hover {
            border-color: #06b6d4;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
            background: linear-gradient(135deg, #1e293b, #164e63);
        }

        /* RANKING LEADERBOARD */
        .leaderboard-list {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .rank-item {
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border: 2px solid #334155;
            padding: 12px 18px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
        }
        .rank-item.top-1 { border-color: #fbbf24; background: linear-gradient(90deg, rgba(251, 191, 36, 0.15), rgba(30, 41, 59, 0.9)); }
        .rank-item.top-2 { border-color: #94a3b8; }
        .rank-item.top-3 { border-color: #b45309; }

        /* OVERLAYS & MODALS */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 9, 19, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            z-index: 50;
            pointer-events: auto;
        }
        .modal-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 12px; }
        .modal-sub { font-size: 1.15rem; color: #cbd5e1; margin-bottom: 25px; max-width: 550px; line-height: 1.5; }

        .name-input {
            width: 100%;
            max-width: 320px;
            padding: 14px 20px;
            border-radius: 50px;
            border: 2px solid #06b6d4;
            background: #0f172a;
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .btn-action {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #fff;
            border: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.4);
            transition: all 0.2s ease;
        }
        .btn-action:hover { transform: scale(1.05); }

        .back-link {
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            pointer-events: auto;
        }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <!-- INTERACTIVE 60FPS CANVAS BACKGROUND -->
    <canvas id="game-canvas"></canvas>

    <div class="ui-layer">
        <div class="interactive-card">
            <!-- HEADER STATS -->
            <div class="header-bar">
                <div class="badge-stage" id="stage-badge">FASE 1: ESFREGAR O SABÃO 🧼</div>
                <div class="stat-box">
                    <div>⭐ <span class="val-score" id="score-val">0</span></div>
                    <div>🔥 <span class="val-combo" id="combo-val">x1</span></div>
                </div>
            </div>

            <!-- TAB NAVIGATION -->
            <div class="nav-tabs">
                <button class="btn-tab active" id="tab-game" onclick="switchView('game')">🎮 BATALHA DOS GERMES</button>
                <button class="btn-tab" id="tab-rank" onclick="switchView('rank')">🏆 RANKING DOS CAMPEÕES</button>
            </div>

            <!-- PLAY AREA CONTAINER -->
            <div class="play-area" id="play-area">
                <!-- Dynamic Content Rendered via JS -->
            </div>

            <a href="/" class="back-link">⬅️ Voltar ao Portal Lab Kids</a>

            <!-- MODAL OVERLAY -->
            <div class="modal-overlay" id="game-modal">
                <div class="modal-title" id="modal-title" style="color: #38bdf8;">🧼 SUPER AGENTE DA SAÚDE 3D</div>
                <div class="modal-sub" id="modal-sub">
                    Enfrente os Germes em 3 Modos de Ação: Esfregue as mãos com sabão, escove as placas nos dentes e responda ao Quiz da Saúde para subir no Ranking!
                </div>
                <input type="text" id="player-name" class="name-input" placeholder="Digite seu Nome de Agente..." value="Agente Kid">
                <button class="btn-action" onclick="startGame()">⚔️ ENTRAR NA BATALHA DA HIGIENE 🚀</button>
            </div>
        </div>
    </div>

    <script>
        // WEB AUDIO SYNTHESIZER
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'brush') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.linearRampToValueAtTime(350, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554, now + 0.1);
                osc.frequency.setValueAtTime(659, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // CANVAS ANIMATED GERMS & PARTICLES ENGINE
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let canvasGerms = [];
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FloatingGerm {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 20 + 15;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.icon = ['🦠', '👾', '🧫', '🧼', '🪥'][Math.floor(Math.random() * 5)];
                this.angle = Math.random() * Math.PI * 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += 0.02;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.angle) * 0.3);
                ctx.font = `${this.radius * 1.8}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.icon, 0, 0);
                ctx.restore();
            }
        }
        for (let i = 0; i < 25; i++) canvasGerms.push(new FloatingGerm());

        function animateCanvas() {
            ctx.fillStyle = 'rgba(6, 9, 19, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            canvasGerms.forEach(g => { g.update(); g.draw(); });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // LEADERBOARD DEFAULT DATA
        let leaderboard = JSON.parse(localStorage.getItem('lab_higiene_rank')) || [
            { name: "Sofía Silva", score: 1850, avatar: "⭐" },
            { name: "Pedro Henrique", score: 1600, avatar: "🥇" },
            { name: "Gabriel Costa", score: 1420, avatar: "🥈" },
            { name: "Lucas Mendes", score: 1200, avatar: "🥉" },
            { name: "Beatriz Santos", score: 980, avatar: "🌟" }
        ];

        // GAME STATE
        let stage = 1; // 1: Scrub, 2: Teeth, 3: Quiz
        let playerName = "Agente Kid";
        let score = 0;
        let combo = 1;

        function startGame() {
            initAudio();
            const input = document.getElementById('player-name').value.trim();
            if (input) playerName = input;
            document.getElementById('game-modal').style.display = 'none';
            score = 0;
            combo = 1;
            stage = 1;
            loadStage();
        }

        function switchView(view) {
            initAudio();
            document.getElementById('tab-game').className = 'btn-tab' + (view === 'game' ? ' active' : '');
            document.getElementById('tab-rank').className = 'btn-tab' + (view === 'rank' ? ' active' : '');

            const area = document.getElementById('play-area');
            if (view === 'rank') {
                renderLeaderboard(area);
            } else {
                loadStage();
            }
        }

        function loadStage() {
            const area = document.getElementById('play-area');
            area.innerHTML = '';
            document.getElementById('score-val').innerText = score;
            document.getElementById('combo-val').innerText = 'x' + combo;

            if (stage === 1) {
                document.getElementById('stage-badge').innerText = 'FASE 1: ESFREGAR O SABÃO NEON 🧼';
                renderStage1(area);
            } else if (stage === 2) {
                document.getElementById('stage-badge').innerText = 'FASE 2: ESCOVAÇÃO LASER DENTÁRIA 🪥';
                renderStage2(area);
            } else if (stage === 3) {
                document.getElementById('stage-badge').innerText = 'FASE 3: QUIZ COMBATE AOS GERMES 🧠';
                renderStage3(area);
            }
        }

        // STAGE 1: SCRUB GERMS ON HAND
        function renderStage1(area) {
            const title = document.createElement('div');
            title.style.fontSize = '1.2rem';
            title.style.color = '#38bdf8';
            title.style.marginBottom = '15px';
            title.style.fontWeight = '700';
            title.innerText = '🧼 Clique/Esfregue o Sabão Mágico em cima de todos os 5 Germes!';
            area.appendChild(title);

            const hand = document.createElement('div');
            hand.className = 'scrub-hand-container';
            
            let germsLeft = 5;
            const positions = [
                { top: '20%', left: '30%' },
                { top: '60%', left: '20%' },
                { top: '40%', left: '60%' },
                { top: '70%', left: '65%' },
                { top: '25%', left: '70%' }
            ];

            positions.forEach((pos, idx) => {
                const g = document.createElement('div');
                g.className = 'germ-target';
                g.innerText = ['🦠', '👾', '🧫'][idx % 3];
                g.style.top = pos.top;
                g.style.left = pos.left;
                g.onclick = () => {
                    playSound('pop');
                    g.style.transform = 'scale(0) rotate(180deg)';
                    g.style.pointerEvents = 'none';
                    germsLeft--;
                    score += 100 * combo;
                    combo++;
                    document.getElementById('score-val').innerText = score;
                    document.getElementById('combo-val').innerText = 'x' + combo;

                    if (germsLeft <= 0) {
                        setTimeout(() => {
                            stage = 2;
                            loadStage();
                        }, 600);
                    }
                };
                hand.appendChild(g);
            });

            area.appendChild(hand);
        }

        // STAGE 2: BRUSH TEETH PLAQUES
        function renderStage2(area) {
            const title = document.createElement('div');
            title.style.fontSize = '1.2rem';
            title.style.color = '#f43f5e';
            title.style.marginBottom = '15px';
            title.style.fontWeight = '700';
            title.innerText = '🪥 Clique na Escova Mágica em cima das 6 Placas de Tártaro para Limpar o Sorriso!';
            area.appendChild(title);

            const teethBox = document.createElement('div');
            teethBox.className = 'teeth-container';

            let plaquesLeft = 6;

            for (let i = 0; i < 6; i++) {
                const tooth = document.createElement('div');
                tooth.className = 'tooth-unit';
                
                const plaque = document.createElement('div');
                plaque.className = 'tooth-plaque';
                plaque.innerText = '🦠';

                tooth.onclick = () => {
                    if (plaque.style.opacity === '0') return;
                    playSound('brush');
                    plaque.style.opacity = '0';
                    plaquesLeft--;
                    score += 150 * combo;
                    combo++;
                    document.getElementById('score-val').innerText = score;
                    document.getElementById('combo-val').innerText = 'x' + combo;

                    if (plaquesLeft <= 0) {
                        setTimeout(() => {
                            stage = 3;
                            loadStage();
                        }, 600);
                    }
                };

                tooth.appendChild(plaque);
                teethBox.appendChild(tooth);
            }

            area.appendChild(teethBox);
        }

        // STAGE 3: HEALTH QUIZ
        const QUIZ_QUESTIONS = [
            {
                q: "Qual é o tempo ideal recomendado para lavar as mãos com água e sabão?",
                opts: [
                    { text: "No mínimo 20 segundos (cantar Parabéns a Você 2x)", correct: true },
                    { text: "2 segundos apenas na ponta dos dedos", correct: false },
                    { text: "Não precisa de sabão se passar álcool em pó", correct: false },
                    { text: "Lavar apenas no final de semana", correct: false }
                ]
            },
            {
                q: "Qual hábito evita o surgimento de cáries nos dentes?",
                opts: [
                    { text: "Escovar após as refeições e passar fio dental", correct: true },
                    { text: "Comer muito pirulito antes de dormir", correct: false },
                    { text: "Beber refrigerante em vez de água", correct: false },
                    { text: "Morder lápis na sala de aula", correct: false }
                ]
            }
        ];
        let quizIdx = 0;

        function renderStage3(area) {
            if (quizIdx >= QUIZ_QUESTIONS.length) {
                // GAME OVER - SAVE SCORE TO LEADERBOARD
                finishGame();
                return;
            }

            const currentQ = QUIZ_QUESTIONS[quizIdx];

            const qBox = document.createElement('div');
            qBox.style.width = '100%';
            qBox.style.textAlign = 'center';

            const qText = document.createElement('div');
            qText.style.fontSize = '1.25rem';
            qText.style.fontWeight = '700';
            qText.style.color = '#38bdf8';
            qText.style.marginBottom = '20px';
            qText.innerText = currentQ.q;
            qBox.appendChild(qText);

            const grid = document.createElement('div');
            grid.className = 'options-grid';

            currentQ.opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-opt';
                btn.innerText = opt.text;
                btn.onclick = () => {
                    if (opt.correct) {
                        playSound('correct');
                        btn.style.background = 'linear-gradient(135deg, #059669, #10b981)';
                        score += 300 * combo;
                        combo++;
                    } else {
                        btn.style.background = 'linear-gradient(135deg, #dc2626, #ef4444)';
                        combo = 1;
                    }
                    setTimeout(() => {
                        quizIdx++;
                        renderStage3(area);
                    }, 800);
                };
                grid.appendChild(btn);
            });

            qBox.appendChild(grid);
            area.appendChild(qBox);
        }

        function finishGame() {
            playSound('win');
            
            // Add to Leaderboard
            leaderboard.push({ name: playerName, score: score, avatar: "🏆" });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 7);
            localStorage.setItem('lab_higiene_rank', JSON.stringify(leaderboard));

            const modal = document.getElementById('game-modal');
            document.getElementById('modal-title').style.color = '#fbbf24';
            document.getElementById('modal-title').innerText = '🏆 PARABÉNS, AGENTE!';
            document.getElementById('modal-sub').innerHTML = `
                Você concluiu com perfeição todas as etapas de Higiene & Saúde!<br><br>
                ⭐ **Pontuação Final**: <strong style="color: #fbbf24; font-size: 1.6rem;">${score} PONTOS</strong><br>
                Seu nome foi registrado no Ranking dos Campeões!
            `;
            const btn = modal.querySelector('.btn-action');
            btn.innerText = '🏆 VER RANKING E JOGAR NOVAMENTE 🚀';
            btn.onclick = () => {
                modal.style.display = 'none';
                switchView('rank');
            };
            modal.style.display = 'flex';
        }

        function renderLeaderboard(area) {
            area.innerHTML = '';
            const title = document.createElement('div');
            title.style.fontSize = '1.4rem';
            title.style.color = '#fbbf24';
            title.style.fontWeight = '800';
            title.style.marginBottom = '15px';
            title.innerText = '🏆 RANKING DOS SUPER AGENTES DA SAÚDE';
            area.appendChild(title);

            const list = document.createElement('div');
            list.className = 'leaderboard-list';

            leaderboard.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'rank-item' + (idx === 0 ? ' top-1' : idx === 1 ? ' top-2' : idx === 2 ? ' top-3' : '');
                row.innerHTML = `
                    <div>${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '🎖️'} #${idx + 1} <strong>${item.name}</strong></div>
                    <div style="color:#fbbf24;">⭐ ${item.score} pts</div>
                `;
                list.appendChild(row);
            });

            area.appendChild(list);
        }
    </script>
</body>
</html>
