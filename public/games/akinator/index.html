      cursor: pointer;

      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      margin: 40px 0;
    }

    .launcher-img {

      height: 180px;
      border-radius: 50%;
      border: 4px solid #f59e0b;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);

      margin-bottom: 20px;
      background: rgba(255,255,255,0.05);

    .launcher-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .launcher-desc {
